<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat App Gratis</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background: #e5ddd5; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 14px; word-break: break-word; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
    .sent { background: #dcf8c6; align-self: flex-end; }
    .received { background: #fff; align-self: flex-start; }
    .media { max-width: 100%; border-radius: 5px; margin-top: 5px; display: block; }
    #input-box { display: flex; padding: 10px; background: #f0f0f0; gap: 8px; align-items: center; border-top: 1px solid #ccc; }
    input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 14px; }
    button { padding: 10px 18px; background: #075e54; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
    
    /* Layar Login */
    #login-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.98);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      z-index: 999;
      padding: 20px;
    }
    #login-screen input {
      width: 100%;
      max-width: 280px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      text-align: center;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <!-- Layar Login -->
  <div id="login-screen">
    <h2>Masuk Chat</h2>
    <input type="text" id="username-input" placeholder="Masukkan Nama Anda...">
    <button type="button" onclick="login()">Masuk Chat</button>
  </div>

  <!-- Tampilan Chat -->
  <div id="chat-box"></div>

  <div id="input-box">
    <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="uploadFile()">
    <button type="button" onclick="document.getElementById('file-input').click()">📎</button>
    <input type="text" id="msg-input" placeholder="Ketik pesan...">
    <button type="button" onclick="sendMessage()">Kirim</button>
  </div>

  <script>
    const SUPABASE_URL = "https://kffdshllhcxddymphle.supabase.co";
    const SUPABASE_KEY = "sb_publishable_-1a9e-ybPaTV9J8Sjb3klg_DN_QaN0l";
    let supabaseClient = null;

    try {
      if (typeof supabase !== 'undefined') {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch (e) {
      console.error("Supabase init error:", e);
    }

    let currentUser = localStorage.getItem('chat_username') || '';

    if (currentUser) {
      document.getElementById('login-screen').style.display = 'none';
      loadMessages();
    }

    function login() {
      const name = document.getElementById('username-input').value.trim();
      if (!name) return alert('Masukkan nama Anda!');
      currentUser = name;
      localStorage.setItem('chat_username', name);
      document.getElementById('login-screen').style.display = 'none';
      loadMessages();
    }

    async function loadMessages() {
      try {
        const res = await fetch('/api/messages');
        if (!res.ok) return;
        const messages = await res.json();
        const box = document.getElementById('chat-box');
        box.innerHTML = '';
        messages.forEach(m => {
          const div = document.createElement('div');
          div.className = `msg ${m.sender === currentUser ? 'sent' : 'received'}`;
          div.innerText = `${m.sender}: ${m.text}`;
          box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
      } catch (err) {
        console.error(err);
      }
    }

    async function sendMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      try {
        await fetch('/api/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sender: currentUser, text })
        });
        loadMessages();
      } catch (err) {
        console.error(err);
      }
    }

    async function uploadFile() {
      const fileInput = document.getElementById('file-input');
      const file = fileInput.files[0];
      if (!file || !supabaseClient) return;

      const fileName = `${Date.now()}_${file.name}`;
      const { data, error } = await supabaseClient.storage
        .from('chat-uploads')
        .upload(fileName, file);

      if (error) {
        alert('Gagal upload gambar!');
        return;
      }

      const { data: publicUrlData } = supabaseClient.storage
        .from('chat-uploads')
        .getPublicUrl(fileName);

      await fetch('/api/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sender: currentUser, text: `<img src="${publicUrlData.publicUrl}" class="media">` })
      });
      loadMessages();
    }

    // Auto Refresh Pesan Tiap 3 Detik
    setInterval(loadMessages, 3000);
  </script>
</body>
</html>
