<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat App Gratis</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background: #e5ddd5; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 14px; word-break: break-word; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
    .sent { background: #dcf8c6; align-self: flex-end; }
    .received { background: #fff; align-self: flex-start; }
    .media { max-width: 100%; border-radius: 5px; margin-top: 5px; display: block; }
    #input-box { display: flex; padding: 10px; background: #f0f0f0; gap: 8px; align-items: center; border-top: 1px solid #ccc; }
    input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 14px; }
    button { padding: 10px 18px; background: #075e54; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
    
    /* Layar Login */
    #login-screen { 
      position: fixed; 
      top: 0; left: 0; right: 0; bottom: 0; 
      background: rgba(255, 255, 255, 0.98); 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      gap: 15px; 
      z-index: 999; 
      padding: 20px;
    }
    #login-screen input {
      width: 100%;
      max-width: 280px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      text-align: center;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <!-- Layar Login -->
  <div id="login-screen">
    <h2>Masuk Chat</h2>
    <input type="text" id="username-input" placeholder="Masukkan Nama Anda...">
    <button type="button" onclick="login()">Masuk Chat</button>
  </div>

  <!-- Tampilan Chat -->
  <div id="chat-box"></div>

  <div id="input-box">
    <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="uploadFile()">
    <button type="button" onclick="document.getElementById('file-input').click()">📷</button>
    <input type="text" id="msg-input" placeholder="Ketik pesan...">
    <button type="button" onclick="sendMessage()">Kirim</button>
  </div>

  <script>
    // URL dasar Supabase (tanpa /rest/v1/)
    const SUPABASE_URL = "https://kffdshllhcxkddymhple.supabase.co";
    const SUPABASE_KEY = "sb_publishable_-1a9e-ybPaTV9J8Sjb3klg_DN_QAn0l"; 
    
    let supabaseClient = null;
    try {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch(e) {
      console.error("Gagal inisialisasi Supabase:", e);
    }

    let currentUser = "";

    function login() {
      const inputEl = document.getElementById('username-input');
      const user = inputEl ? inputEl.value.trim() : "";
      
      if (!user) {
        alert("Silakan isi nama Anda terlebih dahulu!");
        return;
      }
      
      currentUser = user;
      document.getElementById('login-screen').style.display = 'none';
      loadMessages();
      setInterval(loadMessages, 3000); // Perbarui pesan otomatis tiap 3 detik
    }

    async function loadMessages() {
      try {
        const res = await fetch('/api/messages');
        const data = await res.json();
        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML = '';
        
        if (Array.isArray(data)) {
          data.forEach(msg => {
            const div = document.createElement('div');
            div.className = `msg ${msg.sender_id === currentUser ? 'sent' : 'received'}`;
            div.innerHTML = `<small style="color:#075e54;font-weight:bold">${msg.sender_id}</small><br>${msg.content}`;
            
            if (msg.media_url) {
              div.innerHTML += `<br><img src="${msg.media_url}" class="media">`;
            }
            chatBox.appendChild(div);
          });
          chatBox.scrollTop = chatBox.scrollHeight;
        }
      } catch (e) {
        console.error("Gagal memuat pesan:", e);
      }
    }

    async function sendMessage(mediaUrl = '') {
      const input = document.getElementById('msg-input');
      const content = input.value.trim();
      if (!content && !mediaUrl) return;

      await fetch('/api/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sender_id: currentUser,
          content: content || '📷 Foto',
          media_url: mediaUrl
        })
      });

      input.value = '';
      loadMessages();
    }

    async function uploadFile() {
      const fileInput = document.getElementById('file-input');
      const file = fileInput.files[0];
      if (!file) return;

      if (!supabaseClient) {
        return alert("Supabase belum terkonfigurasi dengan benar.");
      }

      const fileName = `${Date.now()}_${file.name}`;
      const { data, error } = await supabaseClient.storage
        .from('chat-media')
        .upload(fileName, file);

      if (error) return alert('Gagal mengunggah foto: ' + error.message);

      const mediaUrl = `${SUPABASE_URL}/storage/v1/object/public/chat-media/${fileName}`;
      sendMessage(mediaUrl);
    }
  </script>
</body>
</html>
