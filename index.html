<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Chat Realtime</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 20px; background: #f4f4f9; }
    .card { max-width: 400px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    #chat-screen { display: none; }
    #chat-box { height: 300px; border: 1px solid #ccc; overflow-y: auto; padding: 10px; margin-bottom: 10px; background: #fafafa; }
    .msg { margin-bottom: 8px; padding: 6px 10px; border-radius: 4px; max-width: 80%; width: fit-content; }
    .sent { background: #0070f3; color: white; margin-left: auto; }
    .received { background: #e5e5ea; color: black; }
    input { width: calc(100% - 16px); padding: 8px; margin-bottom: 10px; }
    button { width: 100%; padding: 10px; background: #0070f3; color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

<div class="card" id="login-screen">
  <h2>Masuk Chat</h2>
  <input type="text" id="username" placeholder="Masukkan nama Anda...">
  <button onclick="login()">Masuk</button>
</div>

<div class="card" id="chat-screen">
  <h3 id="user-display"></h3>
  <div id="chat-box"></div>
  <input type="text" id="message-input" placeholder="Tulis pesan...">
  <button onclick="sendMessage()">Kirim</button>
</div>

<script>
  let currentUser = '';

  function login() {
    const input = document.getElementById('username').value.trim();
    if (!input) return alert('Nama tidak boleh kosong');
    currentUser = input;
    
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('chat-screen').style.display = 'block';
    document.getElementById('user-display').innerText = 'User: ' + currentUser;
    
    loadMessages();
    setInterval(loadMessages, 3000);
  }

  async function loadMessages() {
    try {
      const res = await fetch('/api/messages');
      if (!res.ok) return;
      const data = await res.json();
      if (!Array.isArray(data)) return;
      
      const box = document.getElementById('chat-box');
      box.innerHTML = '';
      data.forEach(m => {
        const div = document.createElement('div');
        div.className = `msg ${m.sender === currentUser ? 'sent' : 'received'}`;
        div.innerText = `${m.sender}: ${m.text}`;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    } catch (e) {
      console.error("Gagal memuat pesan:", e);
    }
  }

  async function sendMessage() {
    const input = document.getElementById('message-input');
    const text = input.value.trim();
    if (!text) return;

    try {
      await fetch('/api/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sender: currentUser, text: text })
      });
      input.value = '';
      loadMessages();
    } catch (e) {
      alert("Gagal mengirim pesan.");
    }
  }
</script>
</body>
</html>
